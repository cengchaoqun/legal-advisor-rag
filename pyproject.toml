[project]
name = "legal-rag"
version = "0.1.0"
description = "掌柜智库·劳动用工咨询（单人本机演示）"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27,<0.29",
  "pymongo>=4.10,<5.0",
  "pymilvus>=2.4.9,<2.5",
  "neo4j>=5.25,<6.0",
  "minio>=7.2,<8.0",
  "pypdf>=5.1,<6.0",
  "langgraph>=0.2.50,<0.4",
  "jsonschema>=4.23,<5.0",
  "setuptools<81",
]

[project.optional-dependencies]
# 真实嵌入（BGE-M3 稠密+稀疏）与本地推理依赖；Windows CPU 可用，体积较大
embedding = ["FlagEmbedding>=1.3.0", "torch>=2.4,<3.0"]

[dependency-groups]
training = [
  "torch>=2.4,<3.0",
  "transformers>=4.57.3,<5.0",
  "peft>=0.17,<1.0",
  "datasets>=3.0,<4.0",
  "accelerate>=1.0,<2.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "openapi-spec-validator>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true

# 本机为 RTX 5060 Laptop（计算能力 sm_120），需 CUDA ≥12.8 的 torch 轮子；
# 默认 PyPI 轮子为 CPU 版，故显式从 PyTorch 官方 cu128 索引解析 torch。
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
